<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDN Status</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#ddd; margin:0; padding:48px 16px; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.5rem; }
  .ok { color:#3dd68c; font-weight:600; }
  .row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid #222; }
  .muted { color:#777; font-size:.9rem; }
</style>
</head>
<body>
<main>
  <h1>Edge status</h1>
  <p class="ok">All systems operational</p>
  <div class="row"><span>HTTP/2</span><span class="ok">up</span></div>
  <div class="row"><span>Cache</span><span class="ok">up</span></div>
  <div class="row"><span>Origin fetch</span><span class="ok">up</span></div>
  <p class="muted" style="margin-top:24px">Last probe: automated · no public status history</p>
</main>
</body>
</html>
